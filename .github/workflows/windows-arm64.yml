name: Native Windows ARM64
on:
  workflow_dispatch:
  push:
    branches: [native-windows-arm64]
permissions:
  contents: read
concurrency:
  group: native-windows-arm64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: arm64
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.3 black==26.10.1
      - run: python -m black --check .
      - run: python -m unittest discover -v
      - run: python setup_models.py --runtimes-only --acceleration
      - run: python setup_windows_host.py
      - run: python build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-translator-windows-arm64
          path: |
            dist/meeting-translator-windows-arm64.zip
            dist/meeting-translator-windows-arm64.zip.sha256
          if-no-files-found: error
