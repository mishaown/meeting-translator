name: Desktop release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v0.1.0)
        required: true
        default: v0.1.0
      create_draft:
        description: Collect successful builds into a draft prerelease
        type: boolean
        default: true
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-desktop.txt
      - run: python -m unittest discover -v
      - run: python setup_models.py --runtimes-only
      - run: python build_desktop.py
      - uses: actions/upload-artifact@v4
        with:
          name: meeting-translator-${{ matrix.target }}
          path: |
            dist/meeting-translator-${{ matrix.target }}.zip
            dist/meeting-translator-${{ matrix.target }}.zip.sha256
          if-no-files-found: error
  release:
    needs: build
    if: github.event_name == 'push' || inputs.create_draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          python -c 'import os,re; assert re.fullmatch(r"v\d+\.\d+\.\d+(?:[-.][A-Za-z0-9.]+)?", os.environ["RELEASE_TAG"]), "Invalid release tag"'
          gh release create "$RELEASE_TAG" release-assets/* --draft --prerelease --target "$GITHUB_SHA" --title "Meeting Translator $RELEASE_TAG - desktop preview" --notes-file RELEASE_NOTES.md
